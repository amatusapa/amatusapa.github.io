  const start = day0(l.approved_at);
  for (let k = 1; k <= n; k++) out.dues.push({ k, d: start + 30 * k * DAY, amt: inst });
  const end = Math.min(day0(l.status === 'paid' && l.paid_at ? l.paid_at : now), start + 3650 * DAY);
  let denda = 0, late = 0;
  for (let d = start + DAY; d <= end; d += DAY) {
    const paidBy = ok.reduce((s, p) => s + (p.d <= d ? p.a : 0), 0);
    const dueBy = out.dues.reduce((s, x) => s + (x.d < d ? x.amt : 0), 0);
    if (paidBy + 0.5 < dueBy) { denda += lr * Math.max(0, contract - paidBy); late++; }
  }
  out.denda = Math.round(denda); out.lateDays = late;
  const today = day0(now);
  const m = Math.min(n, Math.max(1, Math.ceil((today - start) / (30 * DAY)) || 1));
  out.monthsUsed = m;
  out.payoff = Math.max(0, Math.round(P + I * m + out.denda - paid));
  out.remainingContract = Math.max(0, Math.round(contract + out.denda - paid));
  let cum = 0;
  for (const x of out.dues) { cum += x.amt; if (cum > paid + 0.5) { out.next = { k: x.k, d: x.d, amt: Math.round(cum - paid), overdue: x.d < today }; break; } }
  out.overdue = !!(out.next && out.next.overdue);
  return out;
}

async function refresh(force) {
  if (!S.token) return;
  try {

    if ($('#modal').firstChild && M.refresh) M.refresh();
  } catch (e) { console.warn(e); }
}

function agreementText() {

function initSig() {
  const c = $('#sig'); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0f1b2d';
  let down = false, last;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { down = true; last = pt(e); c.setPointerCapture(e.pointerId); W.signed = true; };
  c.onpointermove = e => { if (!down) return; const p = pt(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
  W.signed = false;
}
async function sendApply() {
  const err = $('#w-err'), btn = $('#w-send');
  if (!$('#agree').checked) return err.textContent = 'Centang persetujuan terlebih dahulu.';
  if (!W.signed) return err.textContent = 'Tanda tangan belum diisi.';
  btn.disabled = true; btn.textContent = 'Mengunggah…'; err.textContent = '';
  try {
    const sig = $('#sig').toDataURL('image/png');
    const files = {};
    for (const [k] of DOCS) {
      const s = W.shots[k];
      const r = await rpc('md_file_put', { p_token: S.token, p_kind: k, p_data: s.data, p_meta: s.meta });
      if (!r.ok) throw new Error(r.err); files[k] = r.id;
    }
    const rs = await rpc('md_file_put', { p_token: S.token, p_kind: 'sign', p_data: sig, p_meta: { at: new Date().toISOString() } });
    if (!rs.ok) throw new Error(rs.err); files.sign = rs.id;
    const g = W.shots.selfie.meta;
    const r = await rpc('md_apply', { p_token: S.token, p_amount: W.amt, p_tenor: W.n, p_files: files, p_geo: { lat: g.lat, lng: g.lng, acc: g.acc, addr: g.addr, at: g.at }, p_agreement: agreementText() });
    if (!r.ok) throw new Error(r.err);
    closeModal(); toast('Pengajuan terkirim. Tunggu persetujuan admin.'); S.tab = 'home'; await refresh(true);
  } catch (e) { err.textContent = 'Gagal: ' + e.message; btn.disabled = false; btn.textContent = 'Setujui & kirim'; }
}

// ---------- kamera dengan waktu & lokasi ----------
const C = { stream: null, geo: null, watch: null, addr: '', facing: 'environment', k: null };
async function openCam(k) {
  C.k = k; C.facing = DOCS.find(d => d[0] === k)[3];
  const el = document.createElement('div'); el.className = 'cam'; el.id = 'cam';
  el.innerHTML = `<video playsinline autoplay muted class="${C.facing === 'user' ? 'mirror' : ''}"></video>${k !== 'selfie' ? '<div class="guide"></div>' : ''}
    <div class="info" id="cam-info">Menyiapkan kamera &amp; lokasi…</div>
    <div class="bar"><button class="btn sm" data-a="camclose">Batal</button><button class="shutter" data-a="snap" aria-label="Ambil foto"></button><button class="btn sm" data-a="flip">Balik</button></div>`;
  document.body.append(el);
  startGeo();
  await startStream();
}
async function startStream() {
  if (C.stream) C.stream.getTracks().forEach(t => t.stop());
  const v = $('#cam video'); if (!v) return;
  v.className = C.facing === 'user' ? 'mirror' : '';
  try {
    C.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: C.facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    v.srcObject = C.stream; await v.play().catch(() => {});
    camInfo();
  } catch (e) { $('#cam-info').innerHTML = '⚠️ Kamera tidak bisa dibuka. Izinkan akses kamera di browser lalu coba lagi.<br><small>' + h(e.message) + '</small>'; }
}
function startGeo() {
  if (!navigator.geolocation) { C.geoErr = 'Perangkat tidak mendukung lokasi'; return; }
  if (C.watch != null) return;
  C.watch = navigator.geolocation.watchPosition(p => {
    const first = !C.geo; C.geo = p.coords; C.geoAt = Date.now(); C.geoErr = null; camInfo();
    if (first || !C.addr) reverse(p.coords.latitude, p.coords.longitude);
  }, e => { C.geoErr = e.code === 1 ? 'Izin lokasi ditolak — aktifkan lokasi untuk melanjutkan' : 'Lokasi belum didapat'; camInfo(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
async function reverse(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=id&lat=${lat}&lon=${lng}`);
    const j = await r.json(); C.addr = (j.display_name || '').split(', ').slice(0, 5).join(', '); camInfo();
  } catch {}
}
function camInfo() {
  const i = $('#cam-info'); if (!i) return;
  const g = C.geo;
  i.innerHTML = `🕒 <span id="cam-clock">${wkt(new Date())}</span><br>${g ? `📍 ${g.latitude.toFixed(5)}, ${g.longitude.toFixed(5)} (±${Math.round(g.accuracy)} m)${C.addr ? '<br>' + h(C.addr) : ''}` : '📍 ' + (C.geoErr || 'Mencari lokasi…')}`;
}
setInterval(() => { const c = $('#cam-clock'); if (c) c.textContent = wkt(new Date()); }, 1000);
function stopCam() {
  if (C.stream) C.stream.getTracks().forEach(t => t.stop()); C.stream = null;
  $('#cam')?.remove();
}
function tzName() { const o = -new Date().getTimezoneOffset() / 60; return { 7: 'WIB', 8: 'WITA', 9: 'WIT' }[o] || 'GMT' + (o >= 0 ? '+' : '') + o; }
function stampAndSave(src, w, hgt, mirror, source) {
  const k = C.k, g = C.geo;
  if (k === 'selfie' && !g) { toast('Lokasi wajib aktif untuk foto selfie'); return false; }
  const maxS = 1400, sc = Math.min(1, maxS / Math.max(w, hgt));
  const cw = Math.round(w * sc), ch = Math.round(hgt * sc);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0, cw, ch);
  const now = new Date();
  const lines = [`${DOCS.find(d => d[0] === k)[1].toUpperCase()} · Modalin · @${S.d.me.username}`,
    `${now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} ${now.toLocaleTimeString('id-ID')} ${tzName()}`,
    g ? `${g.latitude.toFixed(6)}, ${g.longitude.toFixed(6)} (±${Math.round(g.accuracy)} m)` : 'Lokasi tidak tersedia'];
  if (C.addr) lines.push(C.addr);
  const fs = Math.max(14, Math.round(cw / 46)), lh = fs * 1.35, pad = fs * .8, bh = lines.length * lh + pad * 2;
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, ch - bh, cw, bh);
  x.fillStyle = '#fff'; x.textBaseline = 'top';
  lines.forEach((t, i) => { x.font = `${i ? 500 : 700} ${fs}px "Plus Jakarta Sans",sans-serif`; let s = t; while (x.measureText(s).width > cw - pad * 2 && s.length > 10) s = s.slice(0, -2); x.fillText(s === t ? t : s + '…', pad, ch - bh + pad + i * lh); });
  W.shots[k] = { data: c.toDataURL('image/jpeg', .82), meta: { at: now.toISOString(), tz: tzName(), lat: g?.latitude ?? null, lng: g?.longitude ?? null, acc: g ? Math.round(g.accuracy) : null, addr: C.addr || null, source, facing: C.facing, ua: navigator.userAgent.slice(0, 160), w: cw, h: ch } };
  return true;
}
function snap() {
  const v = $('#cam video'); if (!v || !v.videoWidth) return toast('Kamera belum siap');
  if (stampAndSave(v, v.videoWidth, v.videoHeight, false, 'camera')) { stopCam(); wizard(); }
}
async function fileShot(input) {

    const u = userById(l.user_id) || {}, b = l.approved_at ? bill(l, S.d.payments) : null;
    modal(`${mh(`${h(u.full_name || 'Akun terhapus')} · ke-${l.no}`)}<div class="row" style="margin-bottom:14px">${statusPill(l, b)}<span class="small mute">@${h(u.username)} · ${h(u.phone)} · diajukan ${wkt(l.applied_at)}</span></div>
      ${l.status === 'pending' ? `<div class="note warn" style="margin-bottom:14px">Periksa dokumen di bawah, lalu setujui saat dana dicairkan.</div><div class="row" style="margin-bottom:16px"><button class="btn ok" data-a="approve" data-id="${l.id}">Setujui &amp; cairkan hari ini</button><button class="btn bad" data-a="reject" data-id="${l.id}">Tolak</button></div>` : ''}
      ${l.status === 'active' ? vLoanCard(l, true) + `<form data-f="payadd" data-id="${l.id}" class="row" style="margin-top:12px"><input class="i" name="amount" inputmode="numeric" placeholder="Catat pembayaran (Rp)" style="max-width:220px" value="${b ? b.payoff : ''}"><input class="i" type="date" name="paid_on" value="${new Date().toISOString().slice(0, 10)}" style="max-width:170px"><button class="btn pri">Catat bayar</button>${b && b.payoff <= 0 ? `<button type="button" class="btn ok" data-a="markpaid" data-id="${l.id}">Tandai lunas</button>` : ''}</form>` : ''}
      ${l.status !== 'active' && l.approved_at ? `<h3 style="margin-top:16px">Pembayaran</h3>${payTable(l, true)}` : ''}
      <h3 style="margin-top:18px">Dokumen</h3>${thumbs(l)}
      ${l.geo?.lat != null ? `<div class="small mute" style="margin-top:8px">Lokasi selfie: ${h(l.geo.addr || '')} (${(+l.geo.lat).toFixed(5)}, ${(+l.geo.lng).toFixed(5)})</div>` : ''}
      <h3 style="margin-top:18px">Data peminjam</h3><div class="lines">${FIELDS.map(([k, v]) => `<div class="ln"><span>${v}</span><b>${h(k === 'birth_date' ? tgl(u[k]) : u[k] || '-')}</b></div>`).join('')}</div>
      <h3 style="margin-top:18px">Ubah pinjaman</h3><form data-f="loanedit" data-id="${l.id}"><div class="f2">
        <label class="f"><span>Pokok (Rp)</span><input class="i" name="amount" inputmode="numeric" value="${l.amount}"></label>
        <label class="f"><span>Tenor (bulan)</span><select class="i" name="tenor">${[1, 2, 3, 4, 5, 6].map(n => `<option ${+l.tenor === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="f"><span>Bunga / bulan (%)</span><input class="i" name="rate" inputmode="decimal" value="${+l.rate}"></label>
        <label class="f"><span>Denda / hari (%)</span><input class="i" name="late_rate" inputmode="decimal" value="${+l.late_rate}"></label>
        <label class="f"><span>Tanggal cair</span><input class="i" type="date" name="approved_at" value="${l.approved_at ? l.approved_at.slice(0, 10) : ''}"></label>
        <label class="f"><span>Status</span><select class="i" name="status">${['pending', 'active', 'paid', 'rejected', 'cancelled'].map(s => `<option ${l.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
        <label class="f"><span>Catatan</span><input class="i" name="note" value="${h(l.note || '')}"></label>
        <div class="row" style="justify-content:space-between"><button class="btn pri">Simpan perubahan</button><span class="row"><button type="button" class="btn sm" data-a="print" data-id="${l.id}">Cetak perjanjian</button><button type="button" class="btn sm bad" data-a="loandel" data-id="${l.id}">Hapus pinjaman</button></span></div></form>
      <h3 style="margin-top:18px">Perjanjian</h3><div class="agree">${h(l.agreement || '')}</div>`, 'wide', draw);
    fillThumbs();
  };
  draw();
}
function aUser(id) {
  const draw = () => {
    const u = S.d.users.find(x => x.id === +id); if (!u) return closeModal();
    const ls = S.d.loans.filter(l => l.user_id === u.id);
    modal(`${mh(h(u.full_name))}<div class="small mute" style="margin-bottom:14px">@${h(u.username)} · daftar ${tgl(u.created_at)} · login terakhir ${u.last_login ? wkt(u.last_login) : '-'}</div>
      <form data-f="useredit" data-id="${u.id}">${FIELDS.map(([k, v]) => `<label class="f"><span>${v}</span>${k === 'address' ? `<textarea class="i" name="${k}" rows="2">${h(u[k] || '')}</textarea>` : `<input class="i" name="${k}" ${k === 'birth_date' ? 'type="date"' : ''} value="${h(u[k] || '')}">`}</label>`).join('')}
      <div class="f2"><label class="f"><span>Batas pinjaman manual (kosong = otomatis ${rp(u.limit)})</span><input class="i" name="limit_override" inputmode="numeric" value="${u.limit_override ?? ''}"></label>
      <label class="f"><span>Status akun</span><select class="i" name="active"><option value="true" ${u.active ? 'selected' : ''}>Aktif</option><option value="false" ${u.active ? '' : 'selected'}>Nonaktif</option></select></label></div>
      <button class="btn pri">Simpan</button></form>
      <h3 style="margin-top:18px">Reset password</h3><form data-f="userpass" data-id="${u.id}" class="row"><input class="i" name="password" type="text" minlength="6" placeholder="Password baru" style="max-width:240px" autocomplete="off"><button class="btn">Reset</button></form>
      <h3 style="margin-top:18px">Pinjaman</h3><div class="list">${ls.map(loanRow).join('') || '<div class="mute small">Belum ada.</div>'}</div>
      <div style="margin-top:18px"><button class="btn bad" data-a="userdel" data-id="${u.id}">Hapus akun &amp; semua datanya</button></div>`, 'wide', draw);
  };
  draw();
}
async function printLoan(id) {
  const l = S.d.loans.find(x => x.id === +id), w = window.open('', '_blank');
  if (!w) return toast('Izinkan pop-up untuk mencetak');
  w.document.write('<p style="font-family:sans-serif">Menyiapkan…</p>');
  const imgs = {};
  for (const k of ['ktp', 'kk', 'selfie', 'sign']) if (l.files[k]) imgs[k] = await loadImg(l.files[k]).catch(() => '');
  w.document.open();
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Perjanjian ${h(userById(l.user_id)?.full_name || '')}</title><style>body{font:13px/1.55 Georgia,serif;max-width:760px;margin:30px auto;padding:0 20px;color:#000}pre{white-space:pre-wrap;font:inherit}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;border:1px solid #ccc}.s{width:220px}</style>
    <pre>${h(l.agreement)}</pre><p>Disetujui: ${wkt(l.applied_at)}${l.geo?.addr ? ' · ' + h(l.geo.addr) : ''}</p><p>PIHAK KEDUA,</p>${imgs.sign ? `<img class="s" src="${imgs.sign}">` : ''}<p><b>${h(userById(l.user_id)?.full_name || '')}</b></p>
    <h3>Lampiran</h3><div class="g">${['ktp', 'kk', 'selfie'].map(k => imgs[k] ? `<div><b>${k.toUpperCase()}</b><img src="${imgs[k]}"></div>` : '').join('')}</div><script>setTimeout(()=>print(),400)<\/script>`);
  w.document.close();
}
function payModal(id) {
  const l = S.d.loans.find(x => x.id === +id), b = bill(l, S.d.payments);
  W.bukti = null;
  modal(`${mh('Konfirmasi pembayaran')}<p class="mute small">Setelah transfer, isi nominal dan lampirkan bukti. Admin akan memeriksa.</p>${payInfo()}
    <form data-f="pay" data-id="${l.id}" style="margin-top:12px"><label class="f"><span>Nominal (Rp)</span><input class="i" name="amount" inputmode="numeric" required value="${b.next ? Math.min(b.payoff, b.next.amt + (b.overdue ? b.denda : 0)) : b.payoff}"></label>
    <div class="small mute" style="margin:-6px 0 10px">Pelunasan hari ini: ${rp(b.payoff)}</div>
    <label class="f"><span>Bukti transfer (opsional)</span><input class="i" type="file" accept="image/*" id="bukti"></label>
    <label class="f"><span>Catatan</span><input class="i" name="note" placeholder="mis. transfer BCA"></label><div class="err"></div>
    <button class="btn pri wide">Kirim konfirmasi</button></form>`);
}
async function imgToData(f, max = 1400) {
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = img.naturalWidth * sc; c.height = img.naturalHeight * sc; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .82);
}
const num = v => +String(v).replace(/[^\d]/g, '');

async function adm(action, p, msg) {
  const r = await rpc('md_admin', { p_token: S.token, p_action: action, p });
  if (!r.ok) { toast('Gagal: ' + r.err); return false; }
  if (msg) toast(msg); await refresh(true); return true;
}
async function ask(text) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'mask'; el.style.zIndex = 70;
    el.innerHTML = `<div class="modal glass" style="max-width:380px"><p style="margin-top:0;font-weight:600">${h(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-r="0">Batal</button><button class="btn pri" data-r="1">Ya, lanjutkan</button></div></div>`;
    el.onclick = e => { const b = e.target.closest('[data-r]'); if (b || e.target === el) { el.remove(); res(b?.dataset.r === '1'); } };
    document.body.append(el);
  });
}

// ---------- event ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'maskclose') { if (e.target === t) closeModal(); return; }
  if (t.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'auth': authModal(t.dataset.m); break;
    case 'close': closeModal(); break;
    case 'logout': logout(); break;
    case 'tab': S.tab = t.dataset.v; LS.set('tab', S.tab); render(); break;
    case 'atab': S.atab = t.dataset.v; S.q = ''; LS.set('atab', S.atab); render(); break;
    case 'lf': S.lfilter = t.dataset.v; render(); break;
    case 'lvl': S.calc.lvl = +t.dataset.v; S.calc.amt = Math.round(BASE * STEP_UP ** (S.calc.lvl - 1) / 1000) * 1000; render(); break;
    case 'tenor': S.calc.n = +t.dataset.v; t.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); updCalc(); break;
    case 'theme': { const o = ['auto', 'light', 'dark'], n = o[(o.indexOf(LS.get('theme') || 'auto') + 1) % 3]; LS.set('theme', n === 'auto' ? null : n); applyTheme(); render(); break; }
    case 'apply': startApply(); break;
    case 'wnext': W.step++; wizard(); break;
    case 'wback': W.agree = $('#agree')?.checked || W.agree; W.step--; wizard(); break;
    case 'wten': W.n = +t.dataset.v; wizard(); break;
    case 'wsend': sendApply(); break;
    case 'sigclear': initSig(); break;
    case 'cam': openCam(t.dataset.k); break;
    case 'camclose': stopCam(); break;
    case 'flip': C.facing = C.facing === 'user' ? 'environment' : 'user'; startStream(); break;
    case 'snap': snap(); break;
    case 'cancel': if (await ask('Batalkan pengajuan ini?')) { const r = await rpc('md_cancel', { p_token: S.token, p_loan: +id }); toast(r.ok ? 'Pengajuan dibatalkan' : r.err); refresh(true); } break;
    case 'viewloan': viewLoan(id); break;
    case 'pay': payModal(id); break;
    case 'img': { e.preventDefault(); const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = '<span style="color:#fff">Memuat…</span>'; lb.onclick = () => lb.remove(); document.body.append(lb);
      try { lb.innerHTML = `<img src="${await loadImg(id)}" alt="">`; } catch (er) { lb.innerHTML = '<span style="color:#fff">Gagal memuat</span>'; } break; }
    case 'print': printLoan(id); break;
    case 'aloan': aLoan(id); break;
    case 'auser': aUser(id); break;
    case 'approve': if (await ask('Setujui pinjaman ini? Tanggal cair = hari ini.')) adm('loan_update', { id, status: 'active' }, 'Pinjaman disetujui'); break;
    case 'reject': if (await ask('Tolak pengajuan ini?')) adm('loan_update', { id, status: 'rejected' }, 'Pengajuan ditolak'); break;
    case 'markpaid': adm('loan_update', { id, status: 'paid' }, 'Ditandai lunas'); break;
    case 'loandel': if (await ask('Hapus pinjaman ini beserta dokumen dan pembayarannya? Tidak bisa dibatalkan.')) { await adm('loan_delete', { id }, 'Pinjaman dihapus'); closeModal(); } break;
    case 'userdel': if (await ask('Hapus akun ini beserta semua pinjaman, dokumen, dan pembayarannya?')) { await adm('user_delete', { id }, 'Akun dihapus'); closeModal(); } break;
    case 'payok': { const p = S.d.payments.find(x => x.id === +id); await adm('pay_update', { id, status: 'ok' }, 'Pembayaran diterima'); autoPaid(p.loan_id); break; }
    case 'payno': adm('pay_update', { id, status: 'rejected' }, 'Pembayaran ditolak'); break;
    case 'paydel': if (await ask('Hapus catatan pembayaran ini?')) adm('pay_delete', { id }, 'Pembayaran dihapus'); break;
    case 'logclear': if (await ask('Hapus seluruh log aktivitas?')) adm('log_clear', {}, 'Log dihapus'); break;
  }
});
async function autoPaid(loanId) {
  const l = S.d.loans.find(x => x.id === loanId);
  if (l && l.status === 'active' && bill(l, S.d.payments).payoff <= 0) await adm('loan_update', { id: l.id, status: 'paid' }, 'Lunas! Batas pinjaman berikutnya naik 25%');
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'r-amt') { S.calc.amt = +t.value; updCalc(); }
  if (t.id === 'r-late') { S.calc.late = +t.value; updCalc(); }
  if (t.id === 'r-wamt') { W.amt = +t.value; $('#w-amt').textContent = rp(W.amt); $('#w-lines').innerHTML = calcLines(plan(W.amt, W.n)); paintRanges(); }
  if (t.id === 'q') { S.q = t.value; clearTimeout(S.qt); S.qt = setTimeout(() => { const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }, 250); }
  if (t.id === 'agree') W.agree = t.checked;
});
document.addEventListener('change', e => { if (e.target.matches('input[type=file][data-k]')) fileShot(e.target); });
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.f) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f)), err = f.querySelector('.err'), btn = f.querySelector('button:not([type=button])');
  const fail = m => { if (err) err.textContent = m; else toast(m); if (btn) btn.disabled = false; };
  if (btn) btn.disabled = true;
  try {
    switch (f.dataset.f) {
      case 'reg': case 'login': {
        const r = f.dataset.f === 'reg' ? await rpc('md_register', { p: fd }) : await rpc('md_login', { p_user: fd.u, p_pass: fd.p });
        if (!r.ok) return fail(r.err);
        S.token = r.token; LS.set('token', r.token); closeModal(); await refresh(true); toast('Selamat datang!'); break;
      }
      case 'pass': { const r = await rpc('md_pass', { p_token: S.token, p_old: fd.old, p_new: fd.new }); if (!r.ok) return fail(r.err); f.reset(); toast('Password diganti'); break; }
      case 'set': await adm('settings', fd, 'Pengaturan disimpan'); break;
      case 'pay': {
        let fid = null; const file = $('#bukti').files[0];
        if (file) { const up = await rpc('md_file_put', { p_token: S.token, p_kind: 'bukti', p_data: await imgToData(file), p_meta: { at: new Date().toISOString(), name: file.name } }); if (!up.ok) return fail(up.err); fid = up.id; }
        const r = await rpc('md_pay', { p_token: S.token, p_loan: +f.dataset.id, p_amount: num(fd.amount), p_file: fid, p_note: fd.note });
        if (!r.ok) return fail(r.err); closeModal(); toast('Konfirmasi terkirim'); refresh(true); break;
      }
      case 'payadd': { if (!num(fd.amount)) return fail('Isi nominal'); await adm('pay_add', { loan_id: +f.dataset.id, amount: num(fd.amount), paid_on: fd.paid_on }, 'Pembayaran dicatat'); autoPaid(+f.dataset.id); break; }
      case 'loanedit': await adm('loan_update', { id: f.dataset.id, amount: num(fd.amount), tenor: +fd.tenor, rate: +String(fd.rate).replace(',', '.'), late_rate: +String(fd.late_rate).replace(',', '.'), status: fd.status, approved_at: fd.approved_at ? new Date(fd.approved_at + 'T08:00').toISOString() : '', note: fd.note }, 'Pinjaman diperbarui'); break;
      case 'useredit': await adm('user_update', { id: f.dataset.id, ...fd, limit_override: fd.limit_override ? String(num(fd.limit_override)) : '' }, 'Data peminjam disimpan'); break;
      case 'userpass': { if ((fd.password || '').length < 6) return fail('Minimal 6 karakter'); if (await adm('user_pass', { id: f.dataset.id, password: fd.password }, 'Password direset')) f.reset(); break; }
    }
  } catch (er) { fail('Gagal terhubung: ' + er.message); }
  if (btn) btn.disabled = false;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#cam')) stopCam(); else if ($('.lb')) $('.lb').remove(); else closeModal(); } });

function applyTheme() { const t = LS.get('theme'); t ? document.documentElement.dataset.theme = t : delete document.documentElement.dataset.theme; }
applyTheme();
render();
if (S.token) refresh(true);
</script>
