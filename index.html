<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amatusapa Cash</title>
<meta name="description" content="Amatusapa Cash — pinjaman dana tunai.">
<meta name="theme-color" content="#0a1a31">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8; --ink:#0f1b2d; --mute:#5b677a; --line:rgba(15,27,45,.09); --edge:rgba(15,27,45,.06);
  --glass:#ffffff; --glass2:#ffffff; --solid:#ffffff; --field:#f6f7fa;
  --acc:#1f4e8c; --acc2:#14325c; --gold:#b98a2f; --ok:#0f8a5f; --warn:#c98a12; --bad:#c2410c;
  --shadow:0 1px 2px rgba(15,27,45,.04);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080e19; --ink:#e8edf5; --mute:#97a3b6; --line:rgba(255,255,255,.12); --edge:rgba(255,255,255,.06);
  --glass:#0f1726; --glass2:#141e30; --solid:#0f1726; --field:#0b121f;
  --acc:#4f7fd0; --acc2:#2f5aa8; --gold:#d8b267; --ok:#34c08b; --bad:#f07a4a;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#080e19; --ink:#e8edf5; --mute:#97a3b6; --line:rgba(255,255,255,.12); --edge:rgba(255,255,255,.06);
  --glass:#0f1726; --glass2:#141e30; --solid:#0f1726; --field:#0b121f;
  --acc:#4f7fd0; --acc2:#2f5aa8; --gold:#d8b267; --ok:#34c08b; --bad:#f07a4a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
p{margin:0 0 12px;max-width:64ch}
.orbs{display:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
#app>.main{flex:1;width:100%;padding:20px clamp(16px,3vw,40px) 24px;display:flex;flex-direction:column}
#app>.main>.list{align-content:start}
@media (min-width:821px){#app>.main>.grid{flex:1;align-content:stretch}}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) clamp(16px,3vw,40px) 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo{width:36px;height:36px;flex:none;display:block}
.logo svg{width:100%;height:100%;display:block}
.wm{white-space:nowrap}.wm em{font-style:normal;font-weight:600;color:var(--gold);margin-left:.28em}
.promo{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.01em;padding:7px 14px;border-radius:999px;color:var(--ink);background:color-mix(in srgb,var(--gold) 13%,transparent);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent)}
.promo::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.lead{color:var(--mute);font-size:14px;line-height:1.65;margin:0 0 14px}
.sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc2);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
h1{font-size:clamp(28px,5.4vw,46px);line-height:1.08;letter-spacing:-.035em;margin:0 0 12px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.mute{color:var(--mute)}
.small{font-size:13px}
.hero{padding:22px 24px;margin-bottom:16px}.hero .kl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.hero p{margin:0 0 18px;color:var(--mute);max-width:560px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.2fr 1fr}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
.card{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:clamp(30px,6vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.1}
/* slider */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:6px 0;touch-action:pan-y}
.rng::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--acc) 0 var(--p,50%),var(--edge) var(--p,50%));border:1px solid var(--line)}
.rng::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--acc) 0 var(--p,50%),var(--edge) var(--p,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:grab}
.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--edge);border:1px solid var(--line);gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--mute);padding:7px 13px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lines{display:grid;gap:2px;margin:12px 0}
.ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--edge)}
.ln:last-child{border-bottom:0}
.ln b{text-align:right}
.ln.tot{font-size:17px;border-top:1px solid var(--edge);border-bottom:0;padding-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--edge);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--edge);white-space:nowrap}
.pill.pending{background:color-mix(in srgb,var(--warn) 20%,transparent);color:#b45309}
.pill.active{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.pill.paid{background:color-mix(in srgb,var(--ok) 20%,transparent);color:#047857}
.pill.late,.pill.rejected{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.cancelled{color:var(--mute)}
@media (prefers-color-scheme:dark){.pill.pending{color:#fbbf24}.pill.paid{color:#34d399}}
.note{padding:12px 14px;border-radius:14px;background:var(--edge);font-size:13.5px;color:var(--mute)}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:inherit}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:inherit}
ul.rules{margin:0;padding-left:18px}
ul.rules li{margin:6px 0}
/* forms */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input.i,select.i,textarea.i{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:4px 0 8px}
/* modal */
.mask{position:fixed;inset:0;z-index:50;background:var(--bg);animation:fade .15s}
.modal{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
.modal .mi{width:100%;max-width:720px;min-height:100%;margin:0 auto;padding:0 clamp(16px,3vw,40px) calc(28px + env(safe-area-inset-bottom))}
.modal.wide .mi{max-width:none}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.mh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;margin:0 calc(-1 * clamp(16px,3vw,40px)) 18px;padding:calc(12px + env(safe-area-inset-top)) clamp(16px,3vw,40px) 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mh h2{margin:0;flex:1}
.x{border:0;background:var(--edge);width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink);display:grid;place-items:center;padding:0}.x svg{width:14px;height:14px}
/* wizard */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--edge)}
.steps i.on{background:var(--acc)}
.shot{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--edge);aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .ph{text-align:center;color:var(--mute);padding:20px}
.shot .ph svg{display:block;width:40px;height:40px;margin:0 auto 8px;opacity:.55}
.agree{max-height:55dvh;overflow:auto;padding:22px 24px;border-radius:14px;background:var(--solid);border:1px solid var(--edge)}
/* dokumen formal (perjanjian) */
.doc{font:14px/1.75 "Times New Roman",Tinos,Times,Georgia,serif;color:var(--ink);text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.doc.ro{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.doc .dt{text-align:center;font-weight:700;font-size:15.5px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px;margin:0 0 2px}
.doc .dn{text-align:center;margin:0 0 16px;font-size:13px}
.doc p{margin:0 0 10px;max-width:none}
.doc h4{text-align:center;font-size:14px;margin:18px 0 6px;line-height:1.45}.doc h4 span{display:block;font-weight:700}
.doc .ph{font-weight:700;margin:14px 0 4px}
.doc table{font:inherit;margin:0 0 10px;width:100%}.doc td{border:0;padding:1px 6px 1px 0;vertical-align:top}.doc td:first-child{width:38%;white-space:nowrap}.doc td:nth-child(2){width:12px}
@media (max-width:520px){.doc td:first-child{white-space:normal}}
.doc .li{display:grid;grid-template-columns:30px 1fr;margin:0 0 6px}
.doc-bar{display:flex;align-items:center;gap:10px;margin:0 0 12px}.doc-bar .logo{width:30px;height:30px}
.sig{width:100%;height:160px;border-radius:14px;background:#fff;border:1px dashed #94a3b8;touch-action:none;display:block}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--acc)}
/* camera */
.cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:contain;background:#000;min-height:0}
.cam video.mirror{transform:scaleX(-1)}
.cam .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6);color:#fff}
.cam .info{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));padding:10px 14px;border-radius:16px;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);font-size:13px}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
.shutter:active{background:#fff}
.cam .btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.guide{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(78vw,520px);aspect-ratio:1.586;border:2px dashed rgba(255,255,255,.7);border-radius:16px;pointer-events:none}
/* nav */
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;background:var(--edge)!important;border:0!important;box-shadow:none!important;border-radius:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--glass2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{display:grid;gap:10px}
.item{padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item:hover{background:var(--glass2)}
.av{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.thumbs{grid-template-columns:repeat(2,1fr)}}
.th{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--edge);aspect-ratio:1;cursor:zoom-in;position:relative}
.th img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;vertical-align:middle}.badge.z{background:var(--edge);color:var(--mute)}
.todo{padding:14px 16px;border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}.chip::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stages div{padding:10px;border-radius:14px;background:var(--edge);font-size:12.5px;color:var(--mute)}.stages div.on{color:var(--ok);font-weight:700}.stages div b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:2px}.stages div.now{outline:2px solid var(--ok);color:inherit;font-weight:700}
.rek{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--edge);margin-top:8px}
.rek>div{flex:1;min-width:0}.rek b.mono{font:700 18px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px}
label.rek{cursor:pointer}label.rek input{width:18px;height:18px;flex:none}
.cairimg{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin-top:10px}
.th span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:2px 7px;border-radius:8px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:grid;gap:8px;width:min(92vw,420px)}
#toast div{padding:12px 16px;border-radius:12px;font-weight:600;background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);animation:pop .2s}
.load{min-height:100dvh;display:grid;place-items:center}
.gate{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.gate-side{background:#0a1a31;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:40px}
.gate-side .brand{flex-direction:column;font-size:28px;gap:16px}.gate-side .logo{width:88px;height:88px}.gate-side .wm em{color:#e6c37a}
.gate-tag{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.gate-main{display:flex;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top)) clamp(20px,5vw,64px) calc(32px + env(safe-area-inset-bottom))}
.gate-form{width:100%;max-width:380px}.gate-form h2{font-size:24px;margin-bottom:18px}
.gate-m{display:none}
@media (max-width:820px){.gate{grid-template-columns:1fr}.gate-side{display:none}.gate-m{display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:22px;margin-bottom:28px}.gate-m .logo{width:56px;height:56px}.gate-main{align-items:stretch;flex-direction:column;justify-content:center}.gate-form{max-width:none}}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:52px;height:52px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .15s}
.wa:hover{transform:scale(1.05)}.wa svg{width:28px;height:28px;fill:#fff}
.foot{text-align:center;font-size:12px;color:var(--mute);padding:16px 16px calc(16px + env(safe-area-inset-bottom));opacity:.7}
.prog{height:10px;border-radius:99px;background:var(--edge);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.hide-sm{}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
@media (max-width:520px){.hide-sm{display:none}.card{padding:16px}.hero{padding:22px 18px}}
@media print{.orbs,header.top,.tabs,.no-print{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div id="app"></div>

const tgl = d => { d = new Date(d); return isNaN(d) ? '-' : `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`; };
const tglL = d => { d = new Date(d); return `${d.getDate()} ${BLN_L[d.getMonth()]} ${d.getFullYear()}`; };

async function rpc(fn, args = {}) {
  let err;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });

const nextLimit = amt => Math.max(BASE, Math.round(amt * STEP_UP / 1000) * 1000);
function plan(P, n, rate = RATE) {
  const I = P * rate / 100, inst = P / n + I;
  return { P, n, I, inst, total: P + I * n, rows: Array.from({ length: n }, (_, k) => ({ k: k + 1, pokok: P / n, bunga: I, tot: inst })) };
}
// tagihan berjalan sebuah pinjaman
function bill(l, pays, now = Date.now()) {
  const P = +l.amount, n = +l.tenor, r = +l.rate / 100, lr = +l.late_rate / 100;
  const I = P * r, inst = P / n + I, contract = P + I * n;
  const ok = pays.filter(p => p.loan_id === l.id && p.status === 'ok').map(p => ({ d: day0(p.paid_on), a: +p.amount })).sort((a, b) => a.d - b.d);
  const paid = ok.reduce((s, p) => s + p.a, 0);
  const out = { P, n, I, inst, contract, paid, denda: 0, lateDays: 0, dues: [], payoff: 0, next: null };
  if (!l.approved_at) return out;
  const start = day0(l.approved_at);
  for (let k = 1; k <= n; k++) out.dues.push({ k, d: start + 30 * k * DAY, amt: inst });
  const end = Math.min(day0(l.status === 'paid' && l.paid_at ? l.paid_at : now), start + 3650 * DAY);
  let denda = 0, late = 0;
  for (let d = start + DAY; d <= end; d += DAY) {
    const paidBy = ok.reduce((s, p) => s + (p.d <= d ? p.a : 0), 0);
    const dueBy = out.dues.reduce((s, x) => s + (x.d < d ? x.amt : 0), 0);
    if (paidBy + 0.5 < dueBy) { denda += lr * Math.max(0, contract - paidBy); late++; }
  }
  out.denda = Math.round(denda); out.lateDays = late;
  const today = day0(now);
  const m = Math.min(n, Math.max(1, Math.ceil((today - start) / (30 * DAY)) || 1));
  out.monthsUsed = m;
  out.payoff = Math.max(0, Math.round(P + I * m + out.denda - paid));
  out.remainingContract = Math.max(0, Math.round(contract + out.denda - paid));
  let cum = 0;
  for (const x of out.dues) { cum += x.amt; if (cum > paid + 0.5) { out.next = { k: x.k, d: x.d, amt: Math.round(cum - paid), overdue: x.d < today }; break; } }
  out.overdue = !!(out.next && out.next.overdue);
  return out;
}

const PROV = [11, 12, 13, 14, 15, 16, 17, 18, 19, 21, 31, 32, 33, 34, 35, 36, 51, 52, 53, 61, 62, 63, 64, 65, 71, 72, 73, 74, 75, 76, 81, 82, 91, 92, 93, 94, 95, 96, 97];
const regionOk = c => /^\d{6}$/.test(c) && PROV.includes(+c.slice(0, 2)) && c.slice(2, 4) !== '00' && c.slice(4, 6) !== '00';
const digits = v => String(v || '').replace(/\D/g, '');
const FAKE_W = /\b(TES|TEST|TESTING|COBA|UJI|DUMMY|ASDF|QWERTY|QWER|ADMIN|USER|FAKE|PALSU|CONTOH|NAMA|ANONIM|NULL|LOREM|IPSUM|XXX|ABC|ABCD|ABCDE|ASD|JKL|ZXC|HAHA|HEHE|WKWK|SIAPA)\b/;
const KEYB = /(QWER|WERT|ERTY|RTYU|TYUI|YUIO|UIOP|ASDF|SDFG|DFGH|FGHJ|GHJK|HJKL|ZXCV|XCVB|CVBN|VBNM)/;
const V = {
  nik(v, bd) {
    const n = digits(v);
    if (!/^\d{16}$/.test(n)) return 'NIK harus 16 angka';
    if (!regionOk(n.slice(0, 6))) return 'Kode wilayah NIK tidak valid';
    if (n.endsWith('0000') || /(\d)\1{6}/.test(n)) return 'NIK tidak valid';
    let d = +n.slice(6, 8); const m = +n.slice(8, 10), y = +n.slice(10, 12); if (d > 40) d -= 40;
    const b = bd ? new Date(bd + 'T00:00') : null;
    if (!b || isNaN(b) || d !== b.getDate() || m !== b.getMonth() + 1 || y !== b.getFullYear() % 100) return 'NIK tidak cocok dengan tanggal lahir (digit 7–12 NIK = tanggal lahir DDMMYY)';
    return '';
  },
  kk(v) {
    const n = digits(v);
    if (!/^\d{16}$/.test(n)) return 'Nomor KK harus 16 angka';
    if (!regionOk(n.slice(0, 6))) return 'Kode wilayah Nomor KK tidak valid';
    if (n.endsWith('0000') || /(\d)\1{6}/.test(n)) return 'Nomor KK tidak valid';
    const d = +n.slice(6, 8), m = +n.slice(8, 10), yy = +n.slice(10, 12), y = 2000 + yy > new Date().getFullYear() ? 1900 + yy : 2000 + yy, t = new Date(y, m - 1, d);
    if (t.getDate() !== d || t.getMonth() !== m - 1 || t > new Date()) return 'Tanggal terbit pada Nomor KK tidak valid';
    return '';
  },
  name(t, label) {
    const raw = String(t || '').trim(), n = normName(raw);
    if (!raw) return label + ' wajib diisi';
    if (/\d/.test(raw) || /[^\p{L} .,'-]/u.test(raw)) return label + ' hanya boleh huruf';
    if (n.replace(/ /g, '').length < 3) return label + ' terlalu pendek';
    if (/(.)\1\1/.test(n) || FAKE_W.test(n) || KEYB.test(n.replace(/ /g, '')) || n.split(' ').some(w => w.length >= 4 && !/[AIUEOY]/.test(w))) return label + ' tidak wajar — isi sesuai KTP';
    return '';
  },
  phoneNorm(p) { const d = digits(p); return d.startsWith('62') ? '0' + d.slice(2) : d.startsWith('8') ? '0' + d : d; },
  phone(p) {
    const n = V.phoneNorm(p);
    if (!/^08[1-9]\d{7,10}$/.test(n)) return 'Nomor HP tidak valid (contoh 0812xxxxxxxx)';
    if (/(\d)\1{5}/.test(n) || /(12345678|23456789|98765432|87654321)/.test(n)) return 'Nomor HP tidak wajar';
    return '';
  },
  addr(a) {
    const n = String(a || '').trim().toUpperCase();
    if (n.length < 15 || n.split(/\s+/).length < 3) return 'Alamat terlalu singkat — tulis lengkap sesuai KTP (jalan, RT/RW, kelurahan, kecamatan)';
    if (!/[A-Z]{3}/.test(n) || /(.)\1\1\1/.test(n) || /\b(TES|TEST|COBA|DUMMY|ASDF|QWERTY|LOREM|IPSUM|XXX|ABC|SEMBARANG)\b/.test(n)) return 'Alamat tidak wajar — isi sesuai KTP';
    return '';
  },
  age(bd) {
    const b = new Date(bd + 'T00:00'), now = new Date();
    if (!bd || isNaN(b)) return 'Tanggal lahir wajib diisi';
    const min = new Date(now.getFullYear() - 18, now.getMonth(), now.getDate()), max = new Date(now.getFullYear() - 75, now.getMonth(), now.getDate());
    return b > min ? 'Usia minimal 18 tahun' : b < max ? 'Tanggal lahir tidak wajar' : '';
  },
  bankNo(bn, no) {
    const n = digits(no), want = { BCA: 10, MANDIRI: 13, BRI: 15, BNI: 10, BSI: 10 }[String(bn || '').toUpperCase()];
    if (!/^\d{6,20}$/.test(n)) return 'Nomor rekening 6–20 angka';
    if (want && n.length !== want) return `Nomor rekening ${bn} harus ${want} angka`;
    if (/(\d)\1{5}/.test(n) || /(0123456|1234567|2345678|3456789|9876543)/.test(n)) return 'Nomor rekening tidak wajar';
    return '';
  },
  reg(fd) {
    const u = String(fd.username || '').toLowerCase().trim(), pw = fd.password || '';
    return V.name(fd.full_name, 'Nama lengkap') || V.age(fd.birth_date) || V.nik(fd.nik, fd.birth_date) || V.kk(fd.kk_no) || V.addr(fd.address)
      || V.name(fd.birth_place, 'Tempat lahir') || V.name(fd.mother_name, 'Nama ibu kandung')
      || (String(fd.spouse_name || '').trim() ? V.name(fd.spouse_name, 'Nama istri / suami') : '') || V.phone(fd.phone)
      || (normName(fd.mother_name) === normName(fd.full_name) ? 'Nama ibu kandung tidak boleh sama dengan nama Anda' : '')
      || (String(fd.spouse_name || '').trim() && [normName(fd.full_name), normName(fd.mother_name)].includes(normName(fd.spouse_name)) ? 'Nama istri / suami tidak wajar' : '')
      || (!/^[a-z0-9._-]{3,32}$/.test(u) ? 'Username 3–32 karakter: huruf kecil, angka, titik, - atau _' : '')
      || (pw.length < 6 ? 'Password minimal 6 karakter' : '')
      || (pw.toLowerCase() === u || ['123456', '1234567', '12345678', '123456789', 'password', 'qwerty', '111111', '000000', 'abcdef', 'abc123', 'modalin', 'amatusapa'].includes(pw.toLowerCase()) ? 'Password terlalu mudah ditebak' : '');
  },
};

const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function terbilang(n) {
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => x < 12 ? s[x] : x < 20 ? f(x - 10) + ' belas' : x < 100 ? f(Math.floor(x / 10)) + ' puluh ' + f(x % 10) : x < 200 ? 'seratus ' + f(x - 100)
    : x < 1000 ? f(Math.floor(x / 100)) + ' ratus ' + f(x % 100) : x < 2000 ? 'seribu ' + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + ' ribu ' + f(x % 1000)
    : x < 1e9 ? f(Math.floor(x / 1e6)) + ' juta ' + f(x % 1e6) : f(Math.floor(x / 1e9)) + ' miliar ' + f(x % 1e9);
  n = Math.floor(Math.abs(n || 0)); return n ? f(n).replace(/\s+/g, ' ').trim() : 'nol';
}

const itemOf = x => { const m = x.trim().match(/^(\(\d+\)|[a-z]\.|\d+\.)\s+(.*)$/); return m ? { lab: m[1], txt: m[2] } : { lab: '', txt: x.trim() }; };

async function docCode(t) {

}

  K.head = (t, o = {}) => { const sz = o.sz || 11.5, lh = K.lh(sz), bf = o.before ?? 4; return { head: true, h: bf + lh + 2, draw() {
    K.y += bf; K.font(sz, 'bold'); K.color(INK);

      if (l.files?.cair) ev.push({ t: 'Bukti pencairan', cap: (fileById(l.files.cair)?.meta?.at ? wkt(fileById(l.files.cair).meta.at) + ', ' : '') + rp(l.amount), im: await pdfImgId(l.files.cair) });
      for (const p of lp.filter(p => p.file_id)) ev.push({ t: `Bukti bayar ${tgl(p.paid_on)}`, cap: `${rp(p.amount)}, ${(PST[p.status] || p.status).toLowerCase()}`, im: await pdfImgId(p.file_id) });
      if (docL && l !== docL) for (const [k, t] of DOCK) if (l.files?.[k] && l.files[k] !== docL.files[k]) ev.push({ t: `${t} (ke-${l.no})`, cap: docMeta(fileById(l.files[k])), im: await pdfImgId(l.files[k]) });
      if (ev.length) { const rows = K.photos(ev, 3, 52); K.put(sub('Bukti transfer dan dokumen'), rows[0]); rows.slice(1).forEach(r => K.put(r)); }
      if (l.agreement) {
        K.page(); const gs = docBlocks(K, l.agreement, docNo(l)), last = gs.length > 1 ? gs.pop() : [];
        gs.forEach(g => K.put(g)); K.put(last, K.gap(3), await signPK(K, l, u));
      }
    }

    const lids = new Set(ls.map(l => l.id)), pids = new Set(pays.map(p => p.id));
    const lg = (S.d.log || []).filter(g => g.user_id === u.id || [g.detail?.loan, g.detail?.loan_id].some(v => lids.has(+v)) || (g.detail?.id != null && /pay|bayar/i.test(g.action) ? pids.has(+g.detail.id) : g.detail?.id != null && lids.has(+g.detail.id)) || [g.detail?.user, g.detail?.user_id].some(v => +v === u.id));
    K.put(K.head('V. RIWAYAT AKTIVITAS'), K.table(['Waktu', 'Akun', 'Aktivitas', 'Keterangan'], lg.slice().reverse().map(g => [wkt(g.at), '@' + (g.username || '-'), g.action,
      g.detail && Object.keys(g.detail).length ? Object.entries(g.detail).map(([k, v]) => k + ': ' + (typeof v === 'object' ? JSON.stringify(v) : v)).join(', ').slice(0, 220) : '']), [26, 18, 28, 68], [], { sz: 9 }));

    K.put(K.head('VI. PERNYATAAN'),
      K.para(`Data, dokumen, perjanjian, dan riwayat transaksi di atas diambil langsung dari sistem ${APP} pada ${wkt(now)}. PIHAK KEDUA telah menyetujui perjanjian secara elektronik dengan tanda tangan elektronik, swafoto memegang KTP berwaktu dan berkoordinat, serta rekening atas nama sendiri. Berkas ini dapat dicetak dan ditandatangani di atas meterai sebagai penguat jaminan.`, { after: 4 }),
      K.sign({ date: `Magelang, ${tglL(now)}`, left: { role: 'PIHAK PERTAMA', as: 'Pemberi Pinjaman', name: PEMODAL.name }, right: { role: 'PIHAK KEDUA', as: 'Peminjam', name: u.full_name || u.username, sub: 'NIK ' + (u.nik || '-'), meterai: true } }));
  }
  const ymd = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
  const n = K.finish({ title: 'Berkas Jaminan Peminjam', no: users.length > 1 ? `rekap ${users.length} peminjam` : nos[0], code: await docCode(nos.join('|') + now.toISOString()),
    file: users.length > 1 ? `Berkas-Jaminan-Semua-Peminjam-${ymd}` : `Berkas-Jaminan-${fileTag(users[0].full_name || users[0].username)}-${ymd}` });
  toast(`PDF berkas jaminan siap, ${n} halaman`);
  } catch (e) { console.error(e); toast('Gagal membuat PDF'); }
}
function payModal(id) {
  const l = S.d.loans.find(x => x.id === +id), b = bill(l, S.d.payments), me = S.d.me;
  if (!bankOk(me)) return modal(`${mh('Konfirmasi pembayaran')}<div class="note warn" style="margin-bottom:12px">Sebelum mengirim bukti transfer, daftarkan rekening Anda. Pembayaran harus dari rekening atas nama Anda sesuai KTP.</div>${bankForm(me, 'pay:' + l.id)}`);
  const src = l.bank?.lender, from = l.bank?.bank_no ? l.bank : me;
  modal(`${mh('Konfirmasi pembayaran')}
    <form data-f="pay" data-id="${l.id}" style="margin-top:12px"><div class="f"><span>Transfer ke rekening${src ? ' (sama dengan pencairan)' : ' — pilih satu'}</span>${src ? rekRow(src) : rekRow('mandiri', 'to') + rekRow('bca', 'to')}
    </div>
    <div class="note" style="margin-bottom:12px">Dari rekening: <b>${h(bankStr(from))}</b></div>
    <label class="f"><span>Nominal (Rp)</span><input class="i" name="amount" inputmode="numeric" required value="${b.next ? Math.min(b.payoff, b.next.amt + (b.overdue ? b.denda : 0)) : b.payoff}"></label>
    <div class="small mute" style="margin:-6px 0 10px">Pelunasan hari ini: ${rp(b.payoff)}</div>
    <label class="f"><span>Bukti transfer</span><input class="i" type="file" accept="image/*" id="bukti" data-prev="bukti-prev" required></label>
    <div class="shot" id="bukti-prev" style="display:none;margin-bottom:12px"></div>
    <label class="f"><span>Catatan</span><input class="i" name="note" placeholder="opsional"></label>
    <label class="chk"><input type="checkbox" name="own" required><span>Transfer dari rekening saya sendiri.</span></label><div class="err"></div>
    <button class="btn pri wide">Kirim</button></form>`);
}
// onload, bukan img.decode(): decode() bisa tidak pernah selesai di sebagian browser/WebView
const imgEl = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Gambar tidak bisa dibaca')); i.src = src; });
async function imgToData(f, max = 1400) {
  const img = await imgEl(URL.createObjectURL(f));
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = img.naturalWidth * sc; c.height = img.naturalHeight * sc; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .82);
}
const num = v => +String(v).replace(/[^\d]/g, '');

async function adm(action, p, msg) {
  const r = await rpc('md_admin', { p_token: S.token, p_action: action, p });
  if (!r.ok) { toast('Gagal: ' + r.err); return false; }
  if (msg) toast(msg); await refresh(true); return true;
}
async function ask(text) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'mask'; el.style.zIndex = 70;
    el.innerHTML = `<div class="modal glass" style="max-width:380px"><p style="margin-top:0;font-weight:600">${h(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-r="0">Batal</button><button class="btn pri" data-r="1">Ya, lanjutkan</button></div></div>`;
    el.onclick = e => { const b = e.target.closest('[data-r]'); if (b || e.target === el) { el.remove(); res(b?.dataset.r === '1'); } };
    document.body.append(el);
  });
}

// ---------- event ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'maskclose') { if (e.target === t) closeModal(); return; }
  if (t.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'auth': authModal(t.dataset.m); break;
    case 'close': closeModal(); break;
    case 'logout': logout(); break;
    case 'tab': S.tab = t.dataset.v; LS.set('tab', S.tab); render(); break;
    case 'atab': S.atab = t.dataset.v; S.q = ''; LS.set('atab', S.atab); render(); break;
    case 'lf': S.lfilter = t.dataset.v; render(); break;
    case 'lvl': S.calc.lvl = +t.dataset.v; S.calc.amt = Math.round(BASE * STEP_UP ** (S.calc.lvl - 1) / 1000) * 1000; render(); break;
    case 'tenor': S.calc.n = +t.dataset.v; t.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); updCalc(); break;
    case 'theme': { const o = ['auto', 'light', 'dark'], n = o[(o.indexOf(LS.get('theme') || 'auto') + 1) % 3]; LS.set('theme', n === 'auto' ? null : n); applyTheme(); render(); break; }
    case 'apply': startApply(); break;
    case 'wnext': W.step++; wizard(); break;
    case 'wback': W.agree = $('#agree')?.checked || W.agree; W.step--; wizard(); break;
    case 'wten': W.n = +t.dataset.v; wizard(); break;
    case 'wsend': sendApply(); break;
    case 'sigclear': initSig(); break;
    case 'cam': openCam(t.dataset.k); break;
    case 'camclose': stopCam(); break;
    case 'flip': C.facing = C.facing === 'user' ? 'environment' : 'user'; startStream(); break;
    case 'snap': snap(); break;
    case 'cancel': if (await ask('Batalkan pengajuan ini?')) { const r = await rpc('md_cancel', { p_token: S.token, p_loan: +id }); toast(r.ok ? 'Pengajuan dibatalkan' : r.err); refresh(true); } break;
    case 'viewloan': viewLoan(id); break;
    case 'pay': payModal(id); break;
    case 'copy': e.preventDefault(); navigator.clipboard?.writeText(t.dataset.v).then(() => toast('Nomor rekening disalin'), () => toast(t.dataset.v)); break;
    case 'img': { e.preventDefault(); const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = '<span style="color:#fff">Memuat…</span>'; lb.onclick = () => lb.remove(); document.body.append(lb);
      try { lb.innerHTML = `<img src="${await loadImg(id)}" alt="">`; } catch (er) { lb.innerHTML = '<span style="color:#fff">Gagal memuat</span>'; } break; }
    case 'print': perjanjianPdf(id); break;
    case 'struk': strukModal(id); break;
    case 'notif': Notification.requestPermission().then(p => { toast(p === 'granted' ? 'Notifikasi aktif' : 'Notifikasi ditolak browser'); render(); }); break;
    case 'struk-pdf': strukSave('pdf'); break;
    case 'struk-png': strukSave('png'); break;
    case 'aloan': aLoan(id); break;
    case 'auser': aUser(id); break;
    case 'jaminan': jaminanPdf([+id]); break;
    case 'jaminan-all': jaminanPdf(S.d.users.map(u => u.id)); break;
    case 'approve': cairModal(id); break;
    case 'wbank': $('#bankf')?.requestSubmit(); break;
    case 'reject': if (await ask('Tolak pengajuan ini?')) adm('loan_update', { id, status: 'rejected' }, 'Pengajuan ditolak'); break;
    case 'markpaid': adm('loan_update', { id, status: 'paid' }, 'Ditandai lunas'); break;
    case 'loandel': if (await ask('Hapus pinjaman ini beserta dokumen dan pembayarannya? Tidak bisa dibatalkan.')) { await adm('loan_delete', { id }, 'Pinjaman dihapus'); closeModal(); } break;
    case 'userdel': if (await ask('Hapus akun ini beserta semua pinjaman, dokumen, dan pembayarannya?')) { await adm('user_delete', { id }, 'Akun dihapus'); closeModal(); } break;
    case 'payok': { const p = S.d.payments.find(x => x.id === +id); await adm('pay_update', { id, status: 'ok' }, 'Pembayaran diterima'); autoPaid(p.loan_id); break; }
    case 'payno': adm('pay_update', { id, status: 'rejected' }, 'Pembayaran ditolak'); break;
    case 'paydel': if (await ask('Hapus catatan pembayaran ini?')) adm('pay_delete', { id }, 'Pembayaran dihapus'); break;
    case 'logclear': if (await ask('Hapus seluruh log aktivitas?')) adm('log_clear', {}, 'Log dihapus'); break;
  }
});
async function autoPaid(loanId) {
  const l = S.d.loans.find(x => x.id === loanId);
  if (l && l.status === 'active' && bill(l, S.d.payments).payoff <= 0) await adm('loan_update', { id: l.id, status: 'paid' }, 'Lunas. Batas pinjaman naik 25%');
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'r-amt') { S.calc.amt = +t.value; updCalc(); }
  if (t.id === 'r-late') { S.calc.late = +t.value; updCalc(); }
  if (t.id === 'r-wamt') { W.amt = +t.value; $('#w-amt').textContent = rp(W.amt); $('#w-lines').innerHTML = calcLines(plan(W.amt, W.n)); paintRanges(); }
  if (t.id === 'q') { S.q = t.value; clearTimeout(S.qt); S.qt = setTimeout(() => { const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }, 250); }
  if (t.id === 'agree') W.agree = t.checked;

  if (t.name === 'kk_no') t.value = digits(t.value).slice(0, 16);

document.addEventListener('change', e => {

document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.f) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f)), err = f.querySelector('.err'), btn = f.querySelector('button:not([type=button])');
  const fail = m => { if (err) err.textContent = m; else toast(m); if (btn) btn.disabled = false; };
  if (btn) btn.disabled = true;
  try {
    switch (f.dataset.f) {
      case 'reg': case 'login': {
        if (f.dataset.f === 'reg') { const ve = V.reg(fd); if (ve) return fail(ve); fd.phone = V.phoneNorm(fd.phone); fd.nik = digits(fd.nik); fd.kk_no = digits(fd.kk_no); }
        const r = f.dataset.f === 'reg' ? await rpc('md_register', { p: fd }) : await rpc('md_login', { p_user: fd.u, p_pass: fd.p });
        if (!r.ok) return fail(r.err);
        S.token = r.token; LS.set('token', r.token); closeModal(); await refresh(true); toast('Selamat datang!'); break;
      }
      case 'pass': { const r = await rpc('md_pass', { p_token: S.token, p_old: fd.old, p_new: fd.new }); if (!r.ok) return fail(r.err); f.reset(); toast('Password diganti'); break; }
      case 'set': await adm('settings', fd, 'Pengaturan disimpan'); break;
      case 'pay': {
        const file = $('#bukti').files[0];
        if (!file) return fail('Lampirkan foto bukti transfer');
        const l = S.d.loans.find(x => x.id === +f.dataset.id), to = l.bank?.lender || fd.to;
        if (!LENDER[to]) return fail('Pilih rekening tujuan: Mandiri atau BCA');
        if (!fd.own) return fail('Centang pernyataan rekening');
        const up = await rpc('md_file_put', { p_token: S.token, p_kind: 'bukti', p_data: await imgToData(file), p_meta: { at: new Date().toISOString(), name: file.name, from: bankStr(l.bank?.bank_no ? l.bank : S.d.me), to: bankStr(LENDER[to]) } });
        if (!up.ok) return fail(up.err);
        const r = await rpc('md_pay', { p_token: S.token, p_loan: l.id, p_amount: num(fd.amount), p_file: up.id, p_note: fd.note, p_to: to });
        if (!r.ok) return fail(r.err); closeModal(); toast('Terkirim, menunggu verifikasi'); refresh(true); break;
      }
      case 'bank': {
        const p = { bank_name: fd.bank_name === '__lain' ? (fd.bank_other || '').trim() : fd.bank_name, bank_no: fd.bank_no, bank_holder: fd.bank_holder };
        if (!p.bank_name) return fail('Pilih / isi nama bank');
        const be = V.bankNo(p.bank_name, p.bank_no); if (be) return fail(be);
        if (!nameOk(p.bank_holder, S.d.me.full_name)) return fail('Nama pemilik rekening harus sama dengan nama KTP: ' + S.d.me.full_name);
        const r = await rpc('md_set_bank', { p_token: S.token, p });
        if (!r.ok) return fail(r.err);
        await refresh(true);
        const then = f.dataset.then;
        if (then === 'wiz') { W.step++; wizard(); } else if (then.startsWith('pay:')) payModal(then.slice(4)); else toast('Rekening disimpan');
        break;
      }
      case 'verify': {
        const r = await rpc('md_verify', { p_token: S.token, p_id: +f.dataset.id, p_checks: { ktp: !!fd.ktp, selfie: !!fd.selfie, kk: !!fd.kk, rek: !!fd.rek }, p_note: fd.note || '' });
        if (!r.ok) return fail(r.err); toast('Terverifikasi'); await refresh(true); break;
      }
      case 'ident': {
        const ve = V.nik(fd.nik, S.d.me.birth_date) || V.kk(fd.kk_no); if (ve) return fail(ve);
        const r = await rpc('md_set_ident', { p_token: S.token, p: { nik: digits(fd.nik), kk_no: digits(fd.kk_no) } });
        if (!r.ok) return fail(r.err); await refresh(true); startApply(); break;
      }
      case 'cair': {
        const file = $('#cair-file').files[0];
        if (!LENDER[fd.lender]) return fail('Pilih rekening sumber: Mandiri atau BCA');
        if (!file) return fail('Lampirkan bukti transfer pencairan');
        const l = S.d.loans.find(x => x.id === +f.dataset.id), u = userById(l.user_id) || {}, b = loanBank(l, u);
        const up = await rpc('md_file_put', { p_token: S.token, p_kind: 'cair', p_data: await imgToData(file), p_meta: { at: new Date().toISOString(), name: file.name, from: bankStr(LENDER[fd.lender]), to: bankStr(b) } });
        if (!up.ok) return fail(up.err);
        const p = { id: l.id, status: 'active', cair_file: up.id, approved_at: new Date((fd.approved_at || new Date().toISOString().slice(0, 10)) + 'T08:00').toISOString() };
        p.bank = { bank_name: b.bank_name, bank_no: b.bank_no, bank_holder: b.bank_holder, lender: fd.lender };
        if (await adm('loan_update', p, 'Pencairan tersimpan')) aLoan(l.id);
        break;
      }
      case 'payadd': { if (!num(fd.amount)) return fail('Isi nominal'); await adm('pay_add', { loan_id: +f.dataset.id, amount: num(fd.amount), paid_on: fd.paid_on }, 'Pembayaran dicatat'); autoPaid(+f.dataset.id); break; }
      case 'loanedit': await adm('loan_update', { id: f.dataset.id, amount: num(fd.amount), tenor: +fd.tenor, rate: +String(fd.rate).replace(',', '.'), late_rate: +String(fd.late_rate).replace(',', '.'), status: fd.status, approved_at: fd.approved_at ? new Date(fd.approved_at + 'T08:00').toISOString() : '', note: fd.note }, 'Pinjaman diperbarui'); break;
      case 'useredit': await adm('user_update', { id: f.dataset.id, ...fd, limit_override: fd.limit_override ? String(num(fd.limit_override)) : '' }, 'Data peminjam disimpan'); break;
      case 'userpass': { if ((fd.password || '').length < 6) return fail('Minimal 6 karakter'); if (await adm('user_pass', { id: f.dataset.id, password: fd.password }, 'Password direset')) f.reset(); break; }
    }
  } catch (er) { fail('Gagal terhubung: ' + er.message); }
  if (btn) btn.disabled = false;
});
